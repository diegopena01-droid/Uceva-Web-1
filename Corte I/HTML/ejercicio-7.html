<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Formularios avanzados</title>
</head>
<body>
    <h1>Formulario de inscripción universitaria</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0"><br><br>

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br><br>

        <label for="carrera">Carrera:</label>
        <select id="carrera" name="carrera">
            <option value="ingenieria">Ingeniería</option>
            <option value="medicina">Medicina</option>
            <option value="derecho">Derecho</option>
        </select><br><br>

        <p>Género:</p>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="femenino" name="genero" value="femenino">
        <label for="femenino">Femenino</label><br><br>

        <p>Habilidades:</p>
        <input type="checkbox" id="python" name="habilidades" value="python">
        <label for="python">Python</label><br>
        <input type="checkbox" id="java" name="habilidades" value="java">
        <label for="java">Java</label><br>
        <input type="checkbox" id="javascript" name="habilidades" value="javascript">
        <label for="javascript">JavaScript</label><br><br>

        <label for="foto">foto:</label><br>
        <input type="file" id="foto" name="foto"><br><br>

        <label for="comentarios">Comentarios:</label><br>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br><br>

        <button type="submit">Inscribirse</button>
    </form>
</body>
</html>
